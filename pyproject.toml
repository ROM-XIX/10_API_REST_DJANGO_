[project]
name = "softdesk"
version = "0.1.0"
description = "API REST de suivi de bugs et problèmes techniques (OpenClassrooms — projet P10)"
authors = [{ name = "ROM-XIX" }]
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^6.1.0"
djangorestframework = "^3.17.1"
djangorestframework-simplejwt = "^5.5.1"
python-dotenv = "^1.2.2"
drf-nested-routers = "^0.95.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 119


[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)"
]
