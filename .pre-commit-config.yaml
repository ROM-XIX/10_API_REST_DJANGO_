repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: isort
        name: isort (venv)
        entry: poetry run isort
        language: system
        types: [python]
        require_serial: true

      - id: black
        name: black (venv)
        entry: poetry run black
        language: system
        types: [python]
        require_serial: true

      - id: flake8
        name: flake8 (venv)
        entry: poetry run flake8
        language: system
        types: [python]
        require_serial: true
